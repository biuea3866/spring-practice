server:
  tomcat:
    threads:
      max: 100
    accept-count: 200
    max-connections: 200
#    keep-alive-timeout: 1s
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  cache:
    type: caffeine
cache:
  enabled: true # Default to true, can be overridden by CACHE_ENABLED env var
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
