version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-cache-test
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cache_test
    volumes:
      - ../sql/01_init-schema.sql:/docker-entrypoint-initdb.d/01_init-schema.sql
      - ../sql/02_generate-data.sql:/docker-entrypoint-initdb.d/02_generate-data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysql-exporter
    ports:
      - "9104:9104"
    environment:
      MYSQLD_EXPORTER_PASSWORD: root
    command:
      - '--mysqld.address=mysql:3306'
      - '--mysqld.username=root'
    depends_on:
      mysql:
        condition: service_healthy

  app:
    build:
      context: ../.
      dockerfile: docker/Dockerfile
    container_name: spring-cache-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cache_test
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      CACHE_ENABLED: "true" # Default, can be overridden
      NULL_CACHING_ENABLED: "true" # For future use if needed, currently controlled by CacheConfig
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: ["/bin/sh", "-c", "sleep 20 && java -jar app.jar"]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - app
      - mysql-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
